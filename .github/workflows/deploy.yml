name: Scrape menus and deploy

on:
  push:
    branches: [main]
  schedule:
    # Times are UTC (Sweden is UTC+2 in summer, UTC+1 in winter). GitHub can
    # start scheduled runs hours late or skip them, worst at the top of the
    # hour, so runs use odd minutes and repeat often where timing matters.
    # Runs without menu changes don't deploy.
    - cron: '37 15,19 * * 0'        # Sunday: next week's menus
    - cron: '7,27,47 4-8 * * 1'     # Monday 06:07-10:47 summer / 05:07-09:47 winter: ready before 10:00
    - cron: '17 10,12 * * 1'        # Monday: late menus
    - cron: '17 5,7 * * 2-5'        # Tuesday to Friday: late or updated menus
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://douglasdcc.github.io/lundby-lunch

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Download the published menus
        run: |
          curl --fail --silent --show-error --location \
            "$SITE_URL/data/menus.json" --output previous.json \
            || { echo "No published menus yet"; rm -f previous.json; }

      - name: Install pdftotext
        run: command -v pdftotext || { sudo apt-get update && sudo apt-get install --yes poppler-utils; }

      - name: Scrape
        working-directory: scraper
        run: dart run bin/scrape.dart --previous ../previous.json --output ../menus.json

      - name: Compare with the published menus
        id: compare
        run: |
          if [ -f previous.json ] && \
             [ "$(jq -S 'del(.generatedAt)' previous.json)" = "$(jq -S 'del(.generatedAt)' menus.json)" ]; then
            echo "Menus unchanged"
            # Keep the published file so its "updated" time stays the last real change.
            cp previous.json menus.json
            changed=false
          else
            changed=true
          fi
          # Pushes always deploy (the app may have changed); schedules only on new menus.
          if [ "$changed" = true ] || [ "${{ github.event_name }}" != schedule ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the web app
        if: steps.compare.outputs.deploy == 'true'
        working-directory: app
        run: flutter build web --release --base-href /lundby-lunch/ --dart-define=SAMPLE_DATA=false

      - name: Add the menus to the site
        if: steps.compare.outputs.deploy == 'true'
        run: |
          mkdir -p app/build/web/data
          cp menus.json app/build/web/data/menus.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.compare.outputs.deploy == 'true'
        with:
          path: app/build/web

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables schedules after 60 days without repository activity;
  # re-enabling the workflow resets that timer.
  keepalive:
    # Must match the Sunday cron above.
    if: github.event.schedule == '37 15,19 * * 0'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
